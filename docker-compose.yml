services:
  edta-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EDTA_API_KEY: ${EDTA_API_KEY:-}
      EDTA_CORS_ORIGINS: ${EDTA_CORS_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - edta-data:/app/data
      - edta-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  edta-data:
  edta-models:
