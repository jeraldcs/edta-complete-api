# Trained travel recommendation scenarios — keyword match + empathy vehicle mapping
profiles:
  winter_mountain_denver:
    objective: "Safe vehicle recommendation for winter mountain driving."
    required_keywords:
      - denver
      - winter
    optional_keywords:
      - snow
      - icy
      - mountain
      - colorado
      - 500-mile
      - traction
      - safety
    persona: mountain_travel
    preferred_vehicle: awd_suv
    default_miles: 500
    default_rental_days: 4
    route_hint: denver
    pitch: "AWD SUV with strong engine power for winter mountain traction, icy pavement, and driver confidence on the Denver route."
    constraints:
      - awd_preferred
      - strong_engine

