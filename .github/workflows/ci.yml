name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff bandit pip-audit pytest-cov

      - name: Lint
        run: ruff check app tests scripts

      - name: Security scan (bandit)
        run: bandit -r app -ll -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt || true

      - name: Train models
        run: python scripts/train_all_models.py

      - name: Evaluate ML models
        run: python scripts/evaluate_ml_models.py

      - name: Upload ML eval summary
        uses: actions/upload-artifact@v4
        with:
          name: ml-eval-summary
          path: data/generated/ml_eval_summary.json

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing
